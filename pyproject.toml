[project]
name = "termrl"
version = "0.1.0"
description = "Train small LLMs to use a terminal on a single RunPod pod, without containers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.56",
    "trl>=1.0",
    "peft>=0.17",
    "datasets>=3.0",
    "accelerate>=1.0",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["termrl"]
